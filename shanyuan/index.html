<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>善緣地圖 — 台灣公益平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── Reset & Base ───────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111;--ink2:#444;--ink3:#888;--ink4:#bbb;
  --bg:#faf9f7;--bg2:#f3f1ed;--bg3:#ece9e3;
  --white:#fff;
  --green:#1D9E75;--green2:#0F6E56;--green-pale:#e8f5f0;
  --red:#e24b4a;
  --border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.15);
  --radius:10px;--radius-lg:14px;
  --font-serif:'Noto Serif TC',serif;
  --font-mono:'DM Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
}
html{background:var(--bg);color:var(--ink);font-family:var(--font-serif);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
img{max-width:100%}

/* ── Layout ─────────────────────────────────────── */
.container{max-width:900px;margin:0 auto;padding:0 1.5rem}

/* ── Topbar ─────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(250,249,247,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1.5rem;max-width:900px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-mark{
  width:30px;height:30px;background:var(--ink);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:15px;height:15px;fill:white}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-.4px;color:var(--ink)}
.brand-tag{font-size:10px;color:var(--ink3);letter-spacing:.8px;font-family:var(--font-mono);margin-top:1px}

.nav{display:flex;align-items:center;gap:4px}
.nav-tab{
  font-size:13px;padding:6px 14px;border:none;
  background:transparent;color:var(--ink3);border-radius:8px;
  transition:all .15s;font-family:var(--font-serif);
}
.nav-tab:hover{background:var(--bg2);color:var(--ink)}
.nav-tab.on{background:var(--ink);color:white}
.nav-sep{width:1px;height:18px;background:var(--border2);margin:0 4px}

.auth-zone{display:flex;align-items:center;gap:8px}
.auth-btn{
  font-size:12px;padding:6px 14px;border-radius:8px;
  background:transparent;color:var(--ink2);
  border:1px solid var(--border2);transition:all .15s;
  font-family:var(--font-serif);
}
.auth-btn:hover{background:var(--bg2)}
.auth-btn.primary{background:var(--ink);color:white;border-color:var(--ink)}
.auth-btn.primary:hover{background:#333}
.avatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--green-pale);color:var(--green2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;border:1.5px solid var(--green);
  cursor:pointer;
}

/* ── Hero ───────────────────────────────────────── */
.hero{padding:4rem 0 3rem;border-bottom:1px solid var(--border)}
.hero-eyebrow{
  font-size:11px;letter-spacing:2px;color:var(--ink3);
  font-family:var(--font-mono);margin-bottom:1rem;
}
.hero h1{
  font-size:clamp(28px,5vw,44px);font-weight:600;
  line-height:1.2;letter-spacing:-.8px;
  color:var(--ink);margin-bottom:1rem;
}
.hero h1 em{color:var(--green);font-style:normal}
.hero-desc{font-size:15px;color:var(--ink3);line-height:1.8;max-width:500px}
.hero-stats{display:flex;gap:2rem;margin-top:2rem;padding-top:2rem;border-top:1px solid var(--border)}
.hstat-val{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.5px}
.hstat-lbl{font-size:11px;color:var(--ink3);letter-spacing:.5px;font-family:var(--font-mono)}

/* ── Filters ────────────────────────────────────── */
.filter-strip{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  padding:1.5rem 0 1.25rem;border-bottom:1px solid var(--border);
  margin-bottom:1.5rem;
}
.fg{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.flbl{font-size:10px;letter-spacing:1px;color:var(--ink3);font-family:var(--font-mono)}
.fg select{
  font-size:13px;padding:8px 10px;
  border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--white);color:var(--ink);
}
.fg select:focus{outline:2px solid var(--green);outline-offset:1px}
.range-fg{flex:2;min-width:180px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{
  flex:1;-webkit-appearance:none;height:3px;
  background:var(--bg3);border-radius:2px;outline:none;
}
.range-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--ink);cursor:pointer;
}
.rval{font-size:12px;font-weight:500;min-width:68px;font-family:var(--font-mono);color:var(--ink2)}

.result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.result-txt{font-size:12px;color:var(--ink3);font-family:var(--font-mono)}
.result-txt strong{color:var(--ink);font-weight:500}
.fav-pill{
  font-size:11px;padding:4px 12px;border-radius:20px;
  border:1px solid var(--border2);background:transparent;
  color:var(--ink3);transition:all .15s;
  display:flex;align-items:center;gap:5px;
}
.fav-pill:hover{border-color:var(--ink);color:var(--ink)}
.fav-pill.on{background:var(--ink);color:white;border-color:var(--ink)}
.fav-pill svg{width:12px;height:12px}

/* ── City chips ─────────────────────────────────── */
.city-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.city-chip{
  font-size:11px;padding:4px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--white);
  color:var(--ink3);cursor:pointer;transition:all .15s;
  font-family:var(--font-mono);
}
.city-chip:hover{border-color:var(--ink2);color:var(--ink)}
.city-chip.on{background:var(--ink);color:white;border-color:var(--ink)}

/* ── Org Cards ──────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:1.2rem 1.3rem;
  transition:border-color .15s,transform .15s;
  box-shadow:var(--shadow);
}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4;padding-right:6px}
.heart-btn{
  width:30px;height:30px;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;
  border-radius:7px;transition:background .15s;flex-shrink:0;
}
.heart-btn:hover{background:var(--bg2)}
.heart-btn svg{width:14px;height:14px;fill:none;stroke:var(--ink4);stroke-width:2;transition:all .15s}
.heart-btn.saved svg{fill:var(--red);stroke:var(--red)}

.badge{
  display:inline-block;font-size:10px;letter-spacing:.6px;
  padding:2px 8px;border-radius:12px;margin-bottom:8px;
  font-family:var(--font-mono);font-weight:500;
}
.b-child{background:#ddeeff;color:#0a3d6b}
.b-elder{background:#fff0d6;color:#5c3600}
.b-dis{background:#ede9ff;color:#37278a}
.b-animal{background:#ffe8e1;color:#6b1e09}
.b-env{background:#e2f0d4;color:#1f4a07}
.b-gen{background:#ebebeb;color:#333}

.card-desc{font-size:12.5px;color:var(--ink3);line-height:1.7;margin-bottom:10px}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--border);padding-top:10px;
}
.fund-block{display:flex;flex-direction:column}
.fund-val{font-size:16px;font-weight:600;color:var(--ink);font-family:var(--font-mono)}
.fund-lbl{font-size:10px;letter-spacing:.5px;color:var(--ink3)}
.card-city{
  font-size:10px;padding:3px 9px;background:var(--bg2);
  border-radius:12px;color:var(--ink3);font-family:var(--font-mono);
}
.card-link{
  font-size:11px;color:var(--green2);border:1px solid #9FE1CB;
  border-radius:10px;padding:3px 10px;transition:background .15s;
}
.card-link:hover{background:var(--green-pale)}

.empty-msg{
  grid-column:1/-1;padding:3rem;text-align:center;
  color:var(--ink3);font-size:14px;
}

/* ── Blog ───────────────────────────────────────── */
.blog-header{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:2rem 0 1.5rem;border-bottom:1px solid var(--border);
  margin-bottom:1.5rem;
}
.blog-header h2{font-size:22px;font-weight:600;letter-spacing:-.4px}
.write-btn{
  font-size:12px;letter-spacing:.5px;padding:7px 18px;
  background:var(--ink);color:white;border:none;border-radius:8px;
  font-family:var(--font-serif);
}
.write-btn:hover{background:#333}

.compose-box{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:1.5rem;
  margin-bottom:1.5rem;box-shadow:var(--shadow);
}
.compose-box h3{font-size:15px;font-weight:600;margin-bottom:1rem;color:var(--ink)}
.cfield{
  width:100%;font-size:13px;padding:9px 13px;
  border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--bg);color:var(--ink);margin-bottom:10px;display:block;
  transition:border-color .15s;
}
.cfield:focus{outline:none;border-color:var(--green);background:var(--white)}
.cfield-ta{height:100px;resize:vertical}
.crow{display:flex;gap:10px}.crow>.cfield{flex:1}
.c-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.c-cancel{
  font-size:12px;padding:7px 14px;background:transparent;
  color:var(--ink3);border:1px solid var(--border2);border-radius:8px;
  font-family:var(--font-serif);
}
.c-cancel:hover{background:var(--bg2)}
.c-save{
  font-size:12px;padding:7px 18px;background:var(--ink);
  color:white;border:none;border-radius:8px;font-family:var(--font-serif);
}
.c-save:hover{background:#333}

.post-list{display:flex;flex-direction:column}
.post{padding:1.75rem 0;border-bottom:1px solid var(--border)}
.post:last-child{border-bottom:none}
.post-meta{display:flex;align-items:center;gap:8px;margin-bottom:.6rem;flex-wrap:wrap}
.pcat{
  font-size:9px;letter-spacing:1px;padding:2px 9px;border-radius:10px;
  background:var(--bg2);color:var(--ink3);border:1px solid var(--border);
  font-family:var(--font-mono);font-weight:500;
}
.porg{font-size:11px;color:var(--green2);font-family:var(--font-mono)}
.pdate{font-size:11px;color:var(--ink4);font-family:var(--font-mono);margin-left:auto}
.post-title{
  font-size:18px;font-weight:600;color:var(--ink);
  letter-spacing:-.3px;margin-bottom:.5rem;line-height:1.4;
}
.post-body{font-size:14px;color:var(--ink2);line-height:1.9}
.post-actions{display:flex;gap:12px;margin-top:.75rem}
.post-del{
  font-size:11px;color:var(--ink4);background:transparent;
  border:none;cursor:pointer;font-family:var(--font-serif);
  letter-spacing:.3px;padding:0;
}
.post-del:hover{color:var(--red)}
.post-loading{text-align:center;padding:2rem;color:var(--ink3);font-size:13px;font-family:var(--font-mono)}

/* ── Auth Modal ─────────────────────────────────── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:200;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--white);border-radius:var(--radius-lg);
  padding:2rem;width:100%;max-width:380px;margin:1rem;
  box-shadow:0 8px 40px rgba(0,0,0,.15);
  transform:translateY(8px);transition:transform .2s;
}
.modal-bg.open .modal{transform:translateY(0)}
.modal h3{font-size:18px;font-weight:600;margin-bottom:.4rem}
.modal p{font-size:13px;color:var(--ink3);margin-bottom:1.5rem}
.modal-tabs{display:flex;gap:0;margin-bottom:1.5rem;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden}
.mt-btn{
  flex:1;font-size:13px;padding:8px;border:none;
  background:transparent;color:var(--ink3);font-family:var(--font-serif);transition:all .15s;
}
.mt-btn.on{background:var(--ink);color:white}
.modal label{font-size:12px;color:var(--ink3);display:block;margin-bottom:4px;letter-spacing:.3px}
.modal-field{
  width:100%;font-size:14px;padding:10px 13px;
  border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--bg);color:var(--ink);margin-bottom:12px;
  font-family:var(--font-serif);transition:border-color .15s;
}
.modal-field:focus{outline:none;border-color:var(--green);background:var(--white)}
.modal-submit{
  width:100%;padding:11px;background:var(--ink);color:white;
  border:none;border-radius:var(--radius);font-size:14px;
  font-family:var(--font-serif);font-weight:600;margin-top:4px;
}
.modal-submit:hover{background:#333}
.modal-close{
  position:absolute;top:.75rem;right:1rem;
  font-size:18px;background:transparent;border:none;color:var(--ink3);
}
.modal-err{font-size:12px;color:var(--red);margin-bottom:10px;display:none}
.modal-ok{font-size:12px;color:var(--green2);margin-bottom:10px;display:none}
.modal .modal-inner{position:relative}

/* ── Toast ──────────────────────────────────────── */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--ink);color:white;font-size:13px;
  padding:10px 20px;border-radius:30px;z-index:300;
  transition:transform .25s;pointer-events:none;font-family:var(--font-mono);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── Footer ─────────────────────────────────────── */
footer{
  border-top:1px solid var(--border);padding:2rem 1.5rem;
  text-align:center;font-size:12px;color:var(--ink4);
  font-family:var(--font-mono);letter-spacing:.5px;margin-top:3rem;
}

/* ── Utility ────────────────────────────────────── */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ── TOPBAR ──────────────────────────────────── -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="goTab('search')">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div>
        <div class="brand-name">善緣地圖</div>
        <div class="brand-tag">TAIWAN CHARITY</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-tab on" onclick="goTab('search',this)">搜尋團體</button>
      <button class="nav-tab" onclick="goTab('blog',this)">拜訪日誌</button>
      <div class="nav-sep"></div>
      <div class="auth-zone" id="auth-zone">
        <button class="auth-btn" onclick="openModal('login')">登入</button>
        <button class="auth-btn primary" onclick="openModal('signup')">註冊</button>
      </div>
    </nav>
  </div>
</div>

<!-- ── MAIN ────────────────────────────────────── -->
<main>

<!-- SEARCH PANE -->
<div id="pane-search" class="container">
  <div class="hero">
    <div class="hero-eyebrow">TAIWAN CHARITY PLATFORM</div>
    <h1>找到值得支持的<br><em>公益力量</em></h1>
    <p class="hero-desc">依服務性質與募款規模篩選台灣各地社福團體，收藏感興趣的組織，記錄你的捐款旅程。</p>
    <div class="hero-stats">
      <div><div class="hstat-val">12+</div><div class="hstat-lbl">公益團體</div></div>
      <div><div class="hstat-val">6</div><div class="hstat-lbl">服務類別</div></div>
      <div><div class="hstat-val">全台</div><div class="hstat-lbl">服務區域</div></div>
    </div>
  </div>

  <div class="filter-strip">
    <div class="fg">
      <span class="flbl">服務性質</span>
      <select id="f-type" onchange="render()">
        <option value="">全部類別</option>
        <option value="兒少">兒少教育</option>
        <option value="長者">長者照護</option>
        <option value="身障">身心障礙</option>
        <option value="動物">動物保護</option>
        <option value="環境">環境生態</option>
        <option value="綜合">綜合社福</option>
      </select>
    </div>
    <div class="fg range-fg">
      <span class="flbl">年均募款規模（近三年）</span>
      <div class="range-row">
        <input type="range" id="f-fund" min="0" max="5" value="0" step="1" oninput="render()">
        <span class="rval" id="rval">不限</span>
      </div>
    </div>
    <div class="fg">
      <span class="flbl">排序方式</span>
      <select id="f-sort" onchange="render()">
        <option value="name">名稱</option>
        <option value="hi">募款高→低</option>
        <option value="lo">募款低→高</option>
      </select>
    </div>
  </div>

  <div class="city-row" id="city-row"></div>

  <div class="result-bar">
    <span class="result-txt">顯示 <strong id="cnt">0</strong> 個團體</span>
    <button class="fav-pill" id="fav-pill" onclick="toggleFavMode()">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      收藏清單
    </button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- BLOG PANE -->
<div id="pane-blog" class="container hidden">
  <div class="blog-header">
    <h2>拜訪日誌</h2>
    <button class="write-btn" onclick="toggleCompose()" id="write-btn">＋ 撰寫文章</button>
  </div>
  <div id="compose-area" class="hidden">
    <div class="compose-box">
      <h3>新增文章</h3>
      <input class="cfield" id="p-title" type="text" placeholder="文章標題">
      <div class="crow">
        <select class="cfield" id="p-cat">
          <option>拜訪心得</option>
          <option>捐款思考</option>
          <option>團體介紹</option>
          <option>觀察筆記</option>
        </select>
        <input class="cfield" id="p-org" type="text" placeholder="相關團體（選填）">
      </div>
      <textarea class="cfield cfield-ta" id="p-body" placeholder="分享你的觀察、心得或想法..."></textarea>
      <div class="c-actions">
        <button class="c-cancel" onclick="toggleCompose()">取消</button>
        <button class="c-save" onclick="savePost()">發佈</button>
      </div>
    </div>
  </div>
  <div class="post-list" id="post-list"><div class="post-loading">載入中...</div></div>
</div>

</main>

<!-- ── AUTH MODAL ──────────────────────────────── -->
<div class="modal-bg" id="modal-bg" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>歡迎來到善緣地圖</h3>
      <p>登入後可收藏團體、發表拜訪日誌</p>
      <div class="modal-tabs">
        <button class="mt-btn on" id="mt-login" onclick="switchMode('login')">登入</button>
        <button class="mt-btn" id="mt-signup" onclick="switchMode('signup')">註冊</button>
      </div>
      <div class="modal-err" id="modal-err"></div>
      <div class="modal-ok" id="modal-ok"></div>
      <label for="m-email">電子信箱</label>
      <input class="modal-field" id="m-email" type="email" placeholder="you@example.com">
      <label for="m-pw">密碼</label>
      <input class="modal-field" id="m-pw" type="password" placeholder="至少 6 個字元">
      <button class="modal-submit" id="modal-submit" onclick="authAction()">登入</button>
    </div>
  </div>
</div>

<!-- ── TOAST ───────────────────────────────────── -->
<div class="toast" id="toast"></div>

<footer>
  © 2026 善緣地圖 &nbsp;·&nbsp; TAIWAN CHARITY PLATFORM
</footer>

<script>
/* ─────────────────────────────────────────────────
   CONFIGURATION — 填入你的 Supabase 設定
   ───────────────────────────────────────────────── */
const SUPABASE_URL = 'https://amxuewlxbhbimsqjpchj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_74i7hvw4DAYA-70fI3J6XQ_FYA5Sz7N';

/* ─────────────────────────────────────────────────
   STATIC DATA
   ───────────────────────────────────────────────── */
const ORGS = [
  {name:'台灣世界展望會',type:'兒少',badge:'b-child',bl:'兒少教育',desc:'深耕偏鄉兒少教育及社區發展，長期陪伴弱勢家庭，服務遍及全台各縣市。',fund:28,city:'台北',url:'https://www.worldvision.org.tw'},
  {name:'家扶基金會',type:'兒少',badge:'b-child',bl:'兒少教育',desc:'脆弱家庭兒少緊急生活扶助與認養服務，守護每個孩子的健康成長。',fund:22,city:'台中',url:'https://www.ccf.org.tw'},
  {name:'兒福聯盟',type:'兒少',badge:'b-child',bl:'兒少教育',desc:'兒童保護、家庭支持與早期療育，守護每位孩子的安全與成長。',fund:8,city:'台北',url:'https://www.children.org.tw'},
  {name:'台灣少年權益與福利促進聯盟',type:'兒少',badge:'b-child',bl:'兒少教育',desc:'倡議少年司法改革，支援司法少年及邊緣少年回歸社會。',fund:0.5,city:'台北',url:'https://www.tamwel.org.tw'},
  {name:'伊甸社會福利基金會',type:'身障',badge:'b-dis',bl:'身心障礙',desc:'服務身心障礙者與家庭，提供職訓、照護及社區融合支持。',fund:12,city:'台北',url:'https://www.eden.org.tw'},
  {name:'創世社會福利基金會',type:'身障',badge:'b-dis',bl:'身心障礙',desc:'服務植物人及重症者，提供長期養護與家屬心理支持。',fund:5,city:'台北',url:'https://www.genesis.org.tw'},
  {name:'台灣老人福利聯盟',type:'長者',badge:'b-elder',bl:'長者照護',desc:'推動長照政策倡議，提供居家照護與老人日間照顧服務。',fund:3,city:'台北',url:'https://www.oldpeople.org.tw'},
  {name:'老五老基金會',type:'長者',badge:'b-elder',bl:'長者照護',desc:'深耕社區老人關懷，提供獨居老人送餐與電話問候服務。',fund:1.5,city:'高雄',url:'#'},
  {name:'台灣動物社會研究會',type:'動物',badge:'b-animal',bl:'動物保護',desc:'倡議農場動物福利，推動立法改革與教育推廣。',fund:1,city:'台北',url:'https://www.east.org.tw'},
  {name:'台灣動物保護協會',type:'動物',badge:'b-animal',bl:'動物保護',desc:'推動流浪動物TNR與認養不棄養，為毛孩尋找幸福家庭。',fund:0.8,city:'台中',url:'#'},
  {name:'荒野保護協會',type:'環境',badge:'b-env',bl:'環境生態',desc:'守護台灣自然環境，推動棲地保育與環境教育。',fund:2,city:'台北',url:'https://www.sow.org.tw'},
  {name:'台灣千里步道協會',type:'環境',badge:'b-env',bl:'環境生態',desc:'修護台灣山徑步道，串聯在地社區與自然環境。',fund:0.8,city:'台北',url:'https://www.tmitrail.org.tw'},
];

const RLABELS = ['不限','百萬以上','五百萬以上','千萬以上','五千萬以上','億元以上'];
const RMINS   = [0, 1, 5, 10, 50, 100];
const CITIES  = ['全部','台北','台中','高雄','台南','新北','桃園'];

/* ─────────────────────────────────────────────────
   SUPABASE INIT
   ───────────────────────────────────────────────── */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let favSet = new Set();
let favMode = false;
let cityFilter = '全部';
let modalMode = 'login';

/* ─────────────────────────────────────────────────
   AUTH
   ───────────────────────────────────────────────── */
sb.auth.getSession().then(({data:{session}}) => {
  if(session) onLogin(session.user);
});
sb.auth.onAuthStateChange((_ev, session) => {
  if(session) onLogin(session.user); else onLogout();
});

async function onLogin(user) {
  currentUser = user;
  const initials = (user.email||'U').slice(0,1).toUpperCase();
  document.getElementById('auth-zone').innerHTML =
    `<div class="avatar" title="${user.email}" onclick="signOut()">${initials}</div>`;
  await loadFavs();
  render();
}
function onLogout() {
  currentUser = null;
  favSet = new Set();
  document.getElementById('auth-zone').innerHTML =
    `<button class="auth-btn" onclick="openModal('login')">登入</button>
     <button class="auth-btn primary" onclick="openModal('signup')">註冊</button>`;
  render();
}
async function signOut() {
  await sb.auth.signOut();
  toast('已登出');
}

function openModal(mode) {
  switchMode(mode);
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('m-email').focus(),100);
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); clearModalMsgs(); }
function closeModalBg(e) { if(e.target===document.getElementById('modal-bg')) closeModal(); }
function clearModalMsgs() {
  document.getElementById('modal-err').style.display='none';
  document.getElementById('modal-ok').style.display='none';
}
function switchMode(m) {
  modalMode = m;
  document.getElementById('mt-login').classList.toggle('on', m==='login');
  document.getElementById('mt-signup').classList.toggle('on', m==='signup');
  document.getElementById('modal-submit').textContent = m==='login' ? '登入' : '註冊';
  clearModalMsgs();
}

async function authAction() {
  const email = document.getElementById('m-email').value.trim();
  const pw = document.getElementById('m-pw').value;
  const errEl = document.getElementById('modal-err');
  const okEl = document.getElementById('modal-ok');
  clearModalMsgs();
  if(!email||!pw){errEl.textContent='請填寫信箱與密碼';errEl.style.display='block';return;}
  document.getElementById('modal-submit').textContent = '處理中...';
  if(modalMode==='login') {
    const {error} = await sb.auth.signInWithPassword({email,password:pw});
    if(error){errEl.textContent=error.message==='Invalid login credentials'?'信箱或密碼錯誤':error.message;errEl.style.display='block';document.getElementById('modal-submit').textContent='登入';}
    else{closeModal();toast('登入成功！');}
  } else {
    const {error} = await sb.auth.signUp({email,password:pw});
    if(error){errEl.textContent=error.message;errEl.style.display='block';document.getElementById('modal-submit').textContent='註冊';}
    else{okEl.textContent='註冊成功！請確認信箱中的驗證信。';okEl.style.display='block';document.getElementById('modal-submit').textContent='註冊';}
  }
}

/* ─────────────────────────────────────────────────
   FAVOURITES
   ───────────────────────────────────────────────── */
async function loadFavs() {
  if(!currentUser) return;
  const {data} = await sb.from('favourites').select('org_name').eq('user_id', currentUser.id);
  favSet = new Set((data||[]).map(r=>r.org_name));
}

async function toggleFav(name) {
  if(!currentUser){toast('請先登入才能收藏');openModal('login');return;}
  if(favSet.has(name)){
    favSet.delete(name);
    await sb.from('favourites').delete().eq('user_id', currentUser.id).eq('org_name', name);
    toast('已取消收藏');
  } else {
    favSet.add(name);
    await sb.from('favourites').insert({user_id:currentUser.id, org_name:name});
    toast('已加入收藏');
  }
  render();
}

function toggleFavMode() {
  if(!currentUser){toast('請先登入才能查看收藏');openModal('login');return;}
  favMode = !favMode;
  document.getElementById('fav-pill').classList.toggle('on', favMode);
  render();
}

/* ─────────────────────────────────────────────────
   ORG RENDER
   ───────────────────────────────────────────────── */
function fmtFund(v) {
  if(v>=1) return (v%1===0?v:v.toFixed(1))+'億';
  return Math.round(v*10000).toLocaleString()+'萬';
}

function render() {
  const type = document.getElementById('f-type').value;
  const fi   = parseInt(document.getElementById('f-fund').value);
  const fmin = RMINS[fi];
  const sort = document.getElementById('f-sort').value;
  document.getElementById('rval').textContent = RLABELS[fi];

  let list = ORGS.filter(o => {
    if(favMode && !favSet.has(o.name)) return false;
    if(type && o.type !== type) return false;
    if(o.fund < fmin) return false;
    if(cityFilter !== '全部' && o.city !== cityFilter) return false;
    return true;
  });
  if(sort==='hi') list.sort((a,b)=>b.fund-a.fund);
  else if(sort==='lo') list.sort((a,b)=>a.fund-b.fund);
  else list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));

  document.getElementById('cnt').textContent = list.length;
  const g = document.getElementById('grid');
  if(!list.length){g.innerHTML='<div class="empty-msg">沒有符合條件的團體</div>';return;}
  g.innerHTML = list.map(o=>`
    <div class="card">
      <div class="card-top">
        <div class="card-name">${o.name}</div>
        <button class="heart-btn${favSet.has(o.name)?' saved':''}" onclick="toggleFav('${o.name}')" title="收藏">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
      <span class="badge ${o.badge}">${o.bl}</span>
      <p class="card-desc">${o.desc}</p>
      <div class="card-foot">
        <div class="fund-block">
          <div class="fund-val">${fmtFund(o.fund)}</div>
          <div class="fund-lbl">年均募款</div>
        </div>
        <span class="card-city">${o.city}</span>
        <a class="card-link" href="${o.url}" target="_blank">官網 →</a>
      </div>
    </div>
  `).join('');
}

/* ─────────────────────────────────────────────────
   CITIES
   ───────────────────────────────────────────────── */
function initCities() {
  document.getElementById('city-row').innerHTML = CITIES.map(c=>
    `<button class="city-chip${c==='全部'?' on':''}" onclick="setCity('${c}',this)">${c}</button>`
  ).join('');
}
function setCity(c, el) {
  cityFilter = c;
  document.querySelectorAll('.city-chip').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  render();
}

/* ─────────────────────────────────────────────────
   BLOG / POSTS
   ───────────────────────────────────────────────── */
async function loadPosts() {
  document.getElementById('post-list').innerHTML = '<div class="post-loading">載入中...</div>';
  const {data,error} = await sb.from('posts').select('*').order('created_at',{ascending:false});
  if(error){document.getElementById('post-list').innerHTML='<div class="post-loading">無法載入文章</div>';return;}
  renderPosts(data||[]);
}

function renderPosts(posts) {
  const el = document.getElementById('post-list');
  if(!posts.length){el.innerHTML='<div class="post-loading">還沒有文章，點擊「撰寫文章」開始記錄。</div>';return;}
  el.innerHTML = posts.map(p=>`
    <div class="post" id="post-${p.id}">
      <div class="post-meta">
        <span class="pcat">${p.cat}</span>
        ${p.org?`<span class="porg"># ${p.org}</span>`:''}
        <span class="pdate">${p.created_at?p.created_at.slice(0,10):''}</span>
      </div>
      <div class="post-title">${p.title}</div>
      <div class="post-body">${p.body}</div>
      <div class="post-actions">
        ${currentUser&&currentUser.id===p.user_id?`<button class="post-del" onclick="delPost('${p.id}')">刪除</button>`:''}
      </div>
    </div>
  `).join('');
}

function toggleCompose() {
  if(!currentUser){toast('請先登入才能發文');openModal('login');return;}
  const a = document.getElementById('compose-area');
  a.classList.toggle('hidden');
}

async function savePost() {
  if(!currentUser){toast('請先登入');return;}
  const title = document.getElementById('p-title').value.trim();
  const body  = document.getElementById('p-body').value.trim();
  if(!title||!body){toast('請填寫標題與內容');return;}
  const cat = document.getElementById('p-cat').value;
  const org = document.getElementById('p-org').value.trim();
  const {error} = await sb.from('posts').insert({
    user_id: currentUser.id,
    title, body, cat, org
  });
  if(error){toast('發佈失敗：'+error.message);return;}
  document.getElementById('p-title').value='';
  document.getElementById('p-body').value='';
  document.getElementById('p-org').value='';
  document.getElementById('compose-area').classList.add('hidden');
  toast('已發佈！');
  loadPosts();
}

async function delPost(id) {
  if(!confirm('確定要刪除這篇文章？'))return;
  await sb.from('posts').delete().eq('id',id).eq('user_id',currentUser.id);
  toast('已刪除');
  loadPosts();
}

/* ─────────────────────────────────────────────────
   NAVIGATION
   ───────────────────────────────────────────────── */
function goTab(id, btn) {
  document.getElementById('pane-search').classList.toggle('hidden', id!=='search');
  document.getElementById('pane-blog').classList.toggle('hidden', id!=='blog');
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  else document.querySelector('.nav-tab').classList.add('on');
  if(id==='blog') loadPosts();
}

/* ─────────────────────────────────────────────────
   TOAST
   ───────────────────────────────────────────────── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
}

/* ─────────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────────── */
initCities();
render();
</script>
</body>
</html>
